<body class="bg-white text-slate-900 selection:bg-blue-100 selection:text-blue-900">

    <div id="root"></div>
    <script>
        (function () {
            const faecysSiteUrl = "https://www.faecys.org.ar/";
            const headerLogoSrc = "/faecys-logo.png";
            const footerLogoSrc = "/faecys-campus-logo.png";
            const calculatorUrl = new URL(window.CALCULADORA_URL, window.location.origin);
            const adminLoginUrl = new URL("/admin/login", calculatorUrl.origin).toString();
            const companyApiUrl = new URL("/api/", window.location.origin);
            const adminHashKey = "admin_token";
            // Interruptores temporales: el codigo queda disponible para reactivarlo mas adelante.
            const companyAccessVisible = false;
            const pricingVisible = false;
            let frameId = null;
            let adminModal = null;

            function buildLogo(src, alt, variant) {
                const link = document.createElement("a");
                link.href = faecysSiteUrl;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.className = "faecys-brand-link " + variant;
                link.setAttribute("aria-label", "Visitar sitio institucional de FAECYS");

                const image = document.createElement("img");
                image.src = src;
                image.alt = alt;
                image.decoding = "async";
                image.loading = variant === "faecys-brand-link--header" ? "eager" : "lazy";
                image.className = "faecys-brand-logo";

                link.appendChild(image);
                return link;
            }

            function redirectToAdminCalculator(token) {
                const targetUrl = new URL("/admin/app", calculatorUrl.origin);
                targetUrl.hash = new URLSearchParams({ [adminHashKey]: token }).toString();
                window.location.href = targetUrl.toString();
            }

            async function companyApi(action, payload) {
                const url = new URL(companyApiUrl);
                url.searchParams.set("action", action);
                const response = await fetch(url.toString(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload || {})
                });
                const data = await response.json().catch(function () { return null; });
                if (!response.ok || !data || data.ok === false) {
                    throw new Error((data && data.message) || "No se pudo completar la operación.");
                }
                return data;
            }

            function redirectToCompanyPortal(token) {
                const targetUrl = new URL("/empresas", calculatorUrl.origin);
                targetUrl.searchParams.set("v", "20260803-2345");
                targetUrl.hash = new URLSearchParams({ company_token: token }).toString();
                window.location.href = targetUrl.toString();
            }

            function closeAdminModal() {
                if (!adminModal) {
                    return;
                }

                const forms = adminModal.querySelectorAll("form");
                const feedback = adminModal.querySelector("[data-admin-feedback]");
                forms.forEach(function (form) { form.reset(); });
                if (feedback) {
                    feedback.textContent = "";
                }
                const recovery = adminModal.querySelector("[data-admin-recovery]");
                if (recovery) recovery.hidden = true;
                const loginForm = adminModal.querySelector("[data-admin-login-form]");
                if (loginForm) loginForm.hidden = false;
                adminModal.hidden = true;
            }

            function ensureAdminModal() {
                if (adminModal) {
                    return adminModal;
                }

                adminModal = document.createElement("div");
                adminModal.className = "co-admin-modal";
                adminModal.hidden = true;
                adminModal.innerHTML = `
                    <div class="co-admin-modal-card glass" role="dialog" aria-modal="true" aria-labelledby="co-admin-title">
                        <h2 id="co-admin-title">Acceso administrador</h2>
                        <p>Inicia sesion para habilitar funciones administrativas.</p>
                        <form class="co-admin-form" data-admin-login-form>
                            <label class="co-admin-field">
                                <span>Correo administrador</span>
                                <input name="email" type="email" autocomplete="username" required />
                            </label>
                            <label class="co-admin-field">
                                <span>Contrasena</span>
                                <input name="password" type="password" autocomplete="current-password" required />
                            </label>
                            <button class="co-admin-forgot" data-admin-forgot type="button">Olvidé mi contraseña</button>
                            <p class="co-admin-feedback" data-admin-feedback></p>
                            <div class="co-admin-actions">
                                <button class="co-admin-btn co-admin-btn-secondary" data-admin-close type="button">Cancelar</button>
                                <button class="co-admin-btn co-admin-btn-primary" data-admin-submit type="submit">Ingresar</button>
                            </div>
                        </form>
                        <form class="co-admin-form co-admin-recovery" data-admin-recovery hidden>
                            <p>Ingresá el correo de tu cuenta administradora. Te enviaremos un enlace temporal para crear una contraseña nueva.</p>
                            <label class="co-admin-field">
                                <span>Correo administrador</span>
                                <input name="recovery_email" type="email" autocomplete="email" required />
                            </label>
                            <p class="co-admin-feedback" data-admin-recovery-feedback></p>
                            <div class="co-admin-actions">
                                <button class="co-admin-btn co-admin-btn-secondary" data-admin-recovery-cancel type="button">Volver</button>
                                <button class="co-admin-btn co-admin-btn-primary" data-admin-recovery-submit type="submit">Enviar enlace</button>
                            </div>
                        </form>
                    </div>
                `;
                document.body.appendChild(adminModal);

                const form = adminModal.querySelector("form");
                const feedback = adminModal.querySelector("[data-admin-feedback]");
                const submitButton = adminModal.querySelector("[data-admin-submit]");
                const recoveryForm = adminModal.querySelector("[data-admin-recovery]");
                const recoveryEmail = recoveryForm.querySelector('[name="recovery_email"]');
                const recoveryFeedback = adminModal.querySelector("[data-admin-recovery-feedback]");
                const recoverySubmit = adminModal.querySelector("[data-admin-recovery-submit]");

                adminModal.querySelector("[data-admin-forgot]").addEventListener("click", function () {
                    recoveryEmail.value = String(form.elements.email.value || "").trim();
                    recoveryFeedback.textContent = "";
                    form.hidden = true;
                    recoveryForm.hidden = false;
                    recoveryEmail.focus();
                });

                adminModal.querySelector("[data-admin-recovery-cancel]").addEventListener("click", function () {
                    recoveryForm.hidden = true;
                    form.hidden = false;
                    recoveryFeedback.textContent = "";
                });

                recoveryForm.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    recoveryFeedback.textContent = "Enviando enlace...";
                    recoverySubmit.disabled = true;
                    try {
                        const data = await companyApi("forgot-password", { email: recoveryEmail.value.trim() });
                        recoveryFeedback.textContent = data.message || "Si el correo está registrado, recibirás un enlace para continuar.";
                    } catch (error) {
                        recoveryFeedback.textContent = error && error.message ? error.message : "No se pudo solicitar el enlace.";
                    } finally {
                        recoverySubmit.disabled = false;
                    }
                });

                adminModal.addEventListener("click", function (event) {
                    if (event.target === adminModal || event.target.closest("[data-admin-close]")) {
                        closeAdminModal();
                    }
                });

                window.addEventListener("keydown", function (event) {
                    if (event.key === "Escape" && adminModal && !adminModal.hidden) {
                        closeAdminModal();
                    }
                });

                form.addEventListener("submit", async function (event) {
                    event.preventDefault();
                    feedback.textContent = "";
                    submitButton.disabled = true;
                    submitButton.textContent = "Ingresando...";

                    const formData = new FormData(form);
                    const payload = {
                        email: String(formData.get("email") || "").trim(),
                        password: String(formData.get("password") || "")
                    };

                    try {
                        const response = await fetch(adminLoginUrl, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        });
                        const data = await response.json().catch(function () { return null; });

                        if (!response.ok || !data || !data.token) {
                            throw new Error((data && data.detail) || "No se pudo iniciar la sesion de administrador.");
                        }

                        redirectToAdminCalculator(data.token);
                    } catch (error) {
                        feedback.textContent = error && error.message ? error.message : "No se pudo iniciar la sesion de administrador.";
                    } finally {
                        submitButton.disabled = false;
                        submitButton.textContent = "Ingresar";
                    }
                });

                return adminModal;
            }

            function openAdminAccess() {
                const modal = ensureAdminModal();
                modal.hidden = false;
                const firstInput = modal.querySelector('input[name="email"]');
                if (firstInput) {
                    window.requestAnimationFrame(function () {
                        firstInput.focus();
                    });
                }
            }

            function buildAdminAccessButton() {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "co-admin-access-btn";
                button.textContent = "Acceso administrador";
                button.addEventListener("click", openAdminAccess);
                return button;
            }

            let companyModal = null;

            function closeCompanyAccess() {
                if (companyModal) companyModal.hidden = true;
            }

            function openCompanyAccess() {
                if (!companyModal) {
                    companyModal = document.createElement("div");
                    companyModal.id = "co-company-access-modal";
                    companyModal.className = "co-admin-modal co-company-modal";
                    companyModal.hidden = true;
                    const card = document.createElement("div");
                    card.className = "co-admin-modal-card";
                    card.setAttribute("role", "dialog");
                    card.setAttribute("aria-modal", "true");
                    card.setAttribute("aria-label", "Acceso de empresas");
                    card.innerHTML = '<button class="co-company-modal-close" type="button" aria-label="Cerrar">×</button>';
                    card.appendChild(buildCompanyAccess());
                    companyModal.appendChild(card);
                    companyModal.addEventListener("click", function (event) {
                        if (event.target === companyModal || event.target.closest(".co-company-modal-close")) closeCompanyAccess();
                    });
                    document.body.appendChild(companyModal);
                }
                companyModal.hidden = false;
                const firstInput = companyModal.querySelector('input[name="email"]');
                if (firstInput) window.requestAnimationFrame(function () { firstInput.focus(); });
            }

            function buildCompanyAccessButton() {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "co-company-access-btn";
                button.textContent = "Acceso a empresas";
                button.setAttribute("aria-haspopup", "dialog");
                button.setAttribute("aria-controls", "co-company-access-modal");
                return button;
            }

            function enhanceHeader() {
                const headerTitle = Array.from(document.querySelectorAll("header h1")).find(
                    (element) => element.textContent.trim() === "CALCULADORA DE COMERCIO"
                );

                if (!headerTitle || !headerTitle.parentElement || !headerTitle.parentElement.parentElement) {
                    return;
                }

                const brandContainer = headerTitle.parentElement.parentElement;
                if (!brandContainer.querySelector(".faecys-brand-link--header")) {
                    brandContainer.style.flexWrap = "wrap";
                    brandContainer.style.rowGap = "0.35rem";
                    brandContainer.style.columnGap = "0.75rem";
                    brandContainer.style.maxWidth = "calc(100% - 4rem)";
                    brandContainer.appendChild(
                        buildLogo(headerLogoSrc, "FAECYS", "faecys-brand-link--header")
                    );
                }

                const header = headerTitle.closest("header");
                const calculatorAccess = header && Array.from(header.querySelectorAll("a, button")).find(
                    (element) => ["Acceder", "Acceder calculadora"].includes(element.textContent.trim())
                );
                if (!calculatorAccess) return;

                let pricingAccess = header.querySelector(".co-pricing-nav-link");
                if (!pricingVisible) {
                    if (pricingAccess) pricingAccess.remove();
                } else {
                    if (!pricingAccess) {
                        pricingAccess = document.createElement("a");
                        pricingAccess.href = "#planes";
                        pricingAccess.className = "co-pricing-nav-link";
                        pricingAccess.textContent = "Planes y precios";
                        pricingAccess.addEventListener("click", function (event) {
                            const pricingSection = document.getElementById("planes");
                            if (!pricingSection) return;
                            event.preventDefault();
                            pricingSection.scrollIntoView({ behavior: "smooth", block: "start" });
                        });
                    }
                    if (pricingAccess.nextElementSibling !== calculatorAccess) {
                        calculatorAccess.insertAdjacentElement("beforebegin", pricingAccess);
                    }
                }

                if (calculatorAccess.textContent !== "Acceder calculadora") calculatorAccess.textContent = "Acceder calculadora";
                let companyAccess = header.querySelector(".co-company-access-btn");
                if (!companyAccessVisible) {
                    if (companyAccess) companyAccess.remove();
                    closeCompanyAccess();
                } else {
                    if (!companyAccess) companyAccess = buildCompanyAccessButton();
                    companyAccess.onclick = function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        openCompanyAccess();
                    };
                    if (calculatorAccess.nextElementSibling !== companyAccess) {
                        calculatorAccess.insertAdjacentElement("afterend", companyAccess);
                    }
                }
            }

            function enhanceSocialLinks(footer, brandContainer) {
                if (footer.querySelector("[data-co-social-links]")) return;
                const social = document.createElement("nav");
                social.className = "co-social-links";
                social.setAttribute("data-co-social-links", "");
                social.setAttribute("aria-label", "Redes sociales de Calculadora de Comercio");
                social.innerHTML = `
                    <p class="co-social-title">Seguinos en nuestras redes</p>
                    <div class="co-social-list">
                        <a class="co-social-link" href="https://www.instagram.com/calculadora_de_comercio/" target="_blank" rel="noopener noreferrer" aria-label="Instagram de Calculadora de Comercio (se abre en una pestaña nueva)">
                            <svg class="co-social-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                                <defs><linearGradient id="co-instagram-gradient-footer" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".35" stop-color="#fa7e1e"/><stop offset=".65" stop-color="#d62976"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient></defs>
                                <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#co-instagram-gradient-footer)"/>

                            </svg>
                            <span>Instagram</span>
                        </a>
                        <a class="co-social-link" href="https://www.youtube.com/@calculadoradecomercio" target="_blank" rel="noopener noreferrer" aria-label="YouTube de Calculadora de Comercio (se abre en una pestaña nueva)">
                            <svg class="co-social-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="1" y="5" width="30" height="22" rx="7" fill="#ff0000"/><path d="M13 10.5 22 16l-9 5.5Z" fill="white"/></svg>
                            <span>YouTube</span>
                        </a>
                    </div>
                `;
                brandContainer.parentElement.appendChild(social);
            }

            function enhanceFooter() {
                const footer = document.querySelector("footer");
                if (!footer) {
                    return;
                }

                const footerTitle = Array.from(footer.querySelectorAll("span")).find(
                    (element) => element.textContent.trim() === "Calculadora de Comercio"
                );

                if (!footerTitle || !footerTitle.parentElement) {
                    return;

                        registerStatus.textContent = error && error.message ? error.message : "No se pudo crear la cuenta.";

                        registerSubmit.disabled = false;
                    }

            function scheduleEnhance() {
                if (frameId !== null) {
                    return;
                }

                frameId = window.requestAnimationFrame(function () {
                    frameId = null;
                    enhanceFaecysBranding();
                });
            }

            const observer = new MutationObserver(scheduleEnhance);
            observer.observe(document.body, { childList: true, subtree: true });

            window.addEventListener("load", scheduleEnhance);
            document.addEventListener("DOMContentLoaded", scheduleEnhance);
            scheduleEnhance();
        })();
